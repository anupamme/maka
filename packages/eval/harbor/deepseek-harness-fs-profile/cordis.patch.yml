# The DeepSeek Harness arm's complete plugin composition, with the harness's
# own read/write/edit tools in place of `str_replace_editor`.
#
# One of three arms that differ only in the edit contract the model is given.
# ../deepseek-harness-profile is the baseline; this file is that file with the
# editor rows replaced, and a test asserts that nothing else diverged. The
# provider underneath is the same `dsh-fs-local`, so what changes is the
# contract and not what the filesystem can do.
#
# `package.json` declares no bundles, so the harness composes this tree over an
# empty entry list: every entry the model can observe is named here, and an
# upstream bundle gaining a plugin cannot change this arm's tool surface. A
# missing service is a hard boot failure, not a silent downgrade.
#
# Derived from the harness's own examples/jsonrpc-agent/minimal.cordis.yml —
# the composition BENCHMARK.md names for benchmark runs — with the SDK JSON-RPC
# entry replaced by the CLI's one-shot startup pair, and `agent-spine-demo`
# replaced by the equivalent core services the CLI uses. Compared against that
# composition during development — tool names, tool schemas, system prompt and
# message sequence on the first outbound request — and found identical. That was
# a one-time manual check and not a standing one: nothing in this repository
# reproduces it, so an upstream release can diverge from it silently.
#
# Source: https://github.com/deepseek-ai/deepseek-harness
#   commit 47f943859bef60e4160492346772ded9b24f765a, MIT license.
#   Reproduced text: the persistent-bash description and the persona below.
#
# Two deliberate deviations from the upstream composition, and one place where
# following it is itself the deviation from the shipped defaults.
#
# Reasoning strength: upstream configures neither `thinking` nor
# `reasoningEffort`, and the adapter default resolves to reasoning_effort=high
# on the wire. Command lifetime: upstream's five-minute Bash timeout can
# interrupt package installation before the benchmark deadline and leave the
# task environment unusable for verification.
#
# The third is `streamIdleTimeoutMs`, which upstream sets to 172800000 in
# examples/jsonrpc-agent/minimal.cordis.yml and which these profiles omitted —
# leaving the adapter's own 300000 ms default in force. That is stated here
# because an omission that changes behaviour is a deviation whether or not
# anyone chose it.

- insert:
    # --- core services ---
    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    # The model this arm reports. The upstream composition selects it through a
    # `!!js process.env.DSH_MODEL` expression; naming it directly keeps the
    # frozen spec the only place a model is declared.
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    # `includeRuntimeContext: false` matches the upstream composition, which
    # sets it on agent-spine-demo. Without it the sandbox contributes an extra
    # user-role snapshot that upstream never sends.
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        persona: You are a helpful software engineer assistant.

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    # --- provider ---
    # `streamIdleTimeoutMs` is upstream's own value, from the jsonrpc-agent
    # minimal composition. Omitting it left the adapter's 300000 ms default in
    # force, which is a five-minute ceiling on the gap between two streamed
    # tokens — and this run pairs `reasoningEffort: max` with a 65-minute bash
    # deadline. A turn killed by that timeout would be scored as a failure of
    # whichever edit contract happened to be running.
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        thinking: enabled
        reasoningEffort: max
        streamIdleTimeoutMs: 172800000
        models:
          - id: deepseek-v4-flash
            contextWindow: 1000000

    # --- execution substrate ---
    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: danger-full-access

    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 3900000

    # Configured exactly as the baseline configures it, which is not at all.
    #
    # This carried `cwd: !!js process.env.DSH_CWD ?? process.cwd()` on the
    # reasoning that a contract accepting relative paths needs the backend to
    # agree with bash about where the model is. It changed nothing and made the
    # arms differ outside the editor row: `dsh-fs-local` declares
    # `cwd: z.string().default(process.cwd())` and reads `opts?.cwd ??
    # this.config.cwd`, both tools pass the session's own cwd, and `DSH_CWD` is
    # never set. A setting that cannot be reached is still a difference a
    # reviewer has to rule out.
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

    # No `fs-observation-policy`, in any arm.
    #
    # It was mounted here on the reasoning that it belongs to this contract,
    # because `dsh-tool-fs`'s own guidance tells the model "the default
    # fs-observation-policy requires it". That reasoning does not survive
    # contact with how the harness actually ships: of the four presets in
    # `@deepseek-ai/dsh`, three mount `dsh-tool-fs` and none mounts the policy,
    # which is not even a direct dependency of the harness. And the policy is
    # not specific to this tool family — its own README documents the
    # observations `str_replace_editor` records, and every mutation in either
    # family goes through the same `fs/write-intent` and `fs/edit-intent`
    # waterfalls. It is substrate, not part of an editor.
    #
    # Mounting it in one arm alone gave that arm two failure modes the others
    # cannot have — `FS_NOT_OBSERVED` for an edit without a prior read, and
    # `FS_STALE_VERSION` when anything, including the model's own bash, touches
    # the file in between. On a benchmark where shell and editor are used
    # together constantly, that is a penalty charged to one arm for a rule the
    # upstream deployment does not enforce.
    #
    # The cost of leaving it out is one sentence of `dsh-tool-fs` guidance
    # describing a policy that is not mounted. That costs the model an extra
    # read it would usually do anyway; it never costs it a failed call.

    # --- the tools the model sees ---
    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 3900000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    # `read`, `write`, and `edit`, at the shipped read caps. Unlike the other
    # two arms' editors this row also contributes three system-prompt guidance
    # sections of its own; that is part of the contract being measured, not a
    # confound to remove — each family instructs the model its own way, and the
    # baseline's editor puts all of its guidance in the tool description.
    #
    # `read_image` is not among them: it registers only while a durable
    # attachment store is mounted, and no arm mounts one.
    - id: fs-tools
      name: '@deepseek-ai/dsh-tool-fs'
      config:
        # Set to the baseline editor's shipped `maxOutputChars`. Left at its own
        # shipped default of 50*1024 this arm would read 51200 bytes to the
        # baseline's 16000 characters — a 3.2x window on the same task, which
        # would show up as a contract effect on any task with a large file in it.
        #
        # What this equalises is the budget's number. It does not equalise
        # delivered content or context cost, because the two budgets do not
        # measure the same thing, and the difference is not the one an earlier
        # version of this comment claimed. Both tools number their lines. The
        # baseline's `maybeTruncate` cuts the fully rendered string — prompt
        # line, six-column right-aligned number and two spaces per line, then
        # content (`str-replace-editor/lib/index.js:85-103`). This tool charges
        # `readMaxBytes` against raw line bytes plus one separator each
        # (`tool-fs/lib/index.js:31-48`) and adds the `NNN: ` gutter, the
        # `<path>/<type>/<content>` envelope and the footer afterwards, outside
        # the budget (`:101-112`).
        #
        # Measured, not asserted: `node packages/eval/scripts/measure-read-budget.mjs`
        # reports the residual over every tracked TS/JS/Python source, and
        # `--self-check <dir>` verifies both of its renderers against the
        # shipped packages installed under <dir> rather than trusting the
        # transcription. At 16000 over 2197 files this arm delivers 1.093x the
        # lines and 1.001x the characters.
        #
        # Both tails, among the 570 files where a budget binds for some arm —
        # the ratio is 1.000 for the rest, so a corpus-wide extreme would be a
        # file no budget touched. Most fs-favourable: 1.398x lines
        # (packages/ui/src/bot-brand-logo.tsx) and, on a different file, 1.168x
        # characters. Least: 0.837x lines and 0.720x characters, both
        # apps/desktop/src/renderer/locales/settings-provider-copy.ts, where
        # non-ASCII text costs UTF-8 bytes against the baseline's UTF-16 code
        # units. Equalising delivered content instead would mean choosing a
        # budget from an assumed average line length, which is a larger free
        # parameter than the few percent above.
        #
        # The remaining read-side asymmetry, that the patch arm has no read tool
        # at all, is contract-inherent and stays. Codex registers no tool that
        # reads file text either — files are read through its shell, and its one
        # path-taking read tool, `view_image`, takes images — so an arm that
        # reads with `cat` is that contract, not a handicap applied to it. Every
        # arm has the same bash, at the same 16000-character output cap.
        readMaxBytes: 16000
        # The other cap, left at the value the tool ships with.
        #
        # Raising it to the budget looked like the fix and was much worse.
        # `truncateLine` appends a `... (line truncated to N chars)` marker and
        # `consumeLine` charges the whole thing against `readMaxBytes`, so once
        # the cap approaches the budget a long line no longer fits at all: the
        # window returns **zero** lines, drops every line after it, and the
        # footer invites the model to retry at the offset it just used. No value
        # equalises the two budgets either, because one counts UTF-16 code units
        # and the other UTF-8 bytes, so the largest safe cap depends on the
        # encoding of the line rather than on a number set here.
        #
        # At the shipped 2000 the direction is not the one it looks like.
        # Measured on a 20000-character line followed by 200 short lines, the
        # baseline delivers 1 line and 16240 characters while this arm delivers
        # 201 lines and 4689: the baseline spends its whole budget on the long
        # line and never reaches the rest of the file, while this arm truncates
        # the line, says so, and reads on. Across the whole corpus no file makes
        # this arm return nothing where the baseline returns something. So the
        # cap stays put, and the script reports that synthetic case on every run
        # rather than leaving it to a corpus that contains no long lines.
        readMaxLineLength: 2000

    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: ./.sessions
        compression: none

    # --- CLI one-shot entry ---
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
